---
# A starting point for `podman kube play` or Kubernetes. Replace the domain,
# the networks, the certificate, and the backend placeholder.
apiVersion: v1
kind: Secret
metadata:
  name: postfix-edge-tls
type: kubernetes.io/tls
data:
  tls.crt: REPLACE_WITH_BASE64_CERTIFICATE_CHAIN
  tls.key: REPLACE_WITH_BASE64_PRIVATE_KEY
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: postfix-edge-overrides
data:
  50-local.cf: |
    message_size_limit = 52428800
---
apiVersion: v1
kind: Pod
metadata:
  name: mail
spec:
  containers:
    - name: postfix-edge
      image: ghcr.io/cdf-eagles/postfix-edge:latest
      env:
        - name: POSTFIX_EDGE_DOMAINS
          value: example.internal
        - name: POSTFIX_EDGE_MYNETWORKS
          value: 127.0.0.0/8 192.0.2.0/24
      ports:
        - containerPort: 25
          hostPort: 25
          protocol: TCP
      livenessProbe:
        exec:
          command: [/usr/local/bin/postfix-edge-healthcheck]
        initialDelaySeconds: 20
        periodSeconds: 30
        timeoutSeconds: 10
      readinessProbe:
        exec:
          command: [/usr/local/bin/postfix-edge-healthcheck, --backend]
        periodSeconds: 30
        timeoutSeconds: 10
      securityContext:
        capabilities:
          drop: [ALL]
          add: [CHOWN, DAC_OVERRIDE, FOWNER, SETUID, SETGID, NET_BIND_SERVICE]
      volumeMounts:
        - name: tls
          mountPath: /etc/postfix-edge/tls
          readOnly: true
        - name: overrides
          mountPath: /etc/postfix-edge/main.cf.d
          readOnly: true
        - name: queue
          mountPath: /var/spool/postfix
  # The LMTP backend is a second container in this list. It shares the pod's
  # network namespace, so postfix-edge reaches it at 127.0.0.1:24, the
  # POSTFIX_EDGE_LMTP default.
  volumes:
    - name: tls
      secret:
        secretName: postfix-edge-tls
    - name: overrides
      configMap:
        name: postfix-edge-overrides
    - name: queue
      persistentVolumeClaim:
        claimName: postfix-edge-queue
